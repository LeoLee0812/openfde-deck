<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看懂 openfde.net｜一个网站，两个身份</title>
<meta name="description" content="把 openfde.net 从源码逆向出来重讲一遍：一个网站、两个身份、三条路径，26 页讲完它到底在干什么，以及你该点哪里。">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
  /* 配色与 openfde.net 的 @theme 变量同源：暖米纸 + 赭红 + 墨黑 */
  :root{
    --paper:#F7F5EF; --paper2:#EFEBE0; --surface:#FFFDF8;
    --ink:#17140D; --ink2:#2F2B20; --muted:#6A6356; --faint:#9A9284;
    --line:#E2DCCD; --rule:#D4CDB9; --accent:#C4471F; --accent-soft:#F6E7DD;
    --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
    --serif:Georgia,"Songti SC",KaiTi,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--paper);color:var(--ink2);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden}

  header{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
  .brand{font-family:var(--serif);font-weight:700;font-size:17px;color:var(--ink);white-space:nowrap}
  .brand span{color:var(--accent)}
  .kicker{font-size:12px;color:var(--muted);letter-spacing:1px;white-space:nowrap}
  header .spacer{flex:1}
  .btn{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--rule);background:var(--paper);color:var(--ink2);cursor:pointer;border-radius:2px;text-decoration:none;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .btn.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}

  main{flex:1;display:flex;min-height:0}
  aside{flex:0 0 190px;overflow-y:auto;border-right:1px solid var(--rule);background:var(--paper2);padding:10px}
  aside.hidden{display:none}
  .thumb{display:block;width:100%;margin-bottom:10px;cursor:pointer;border:1px solid var(--line);background:var(--surface);position:relative;line-height:0}
  .thumb img{display:block;width:100%;height:auto;aspect-ratio:16/9;background:var(--paper)}
  .thumb.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .thumb .no{position:absolute;left:0;top:0;background:var(--ink);color:var(--paper);font-size:10px;padding:1px 5px;font-family:var(--serif);line-height:1.4}

  .stage{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .canvas{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:0;position:relative}
  .frame{width:100%;max-width:calc((100vh - 210px) * 16 / 9);aspect-ratio:16/9;background:var(--surface);border:1px solid var(--line)}
  .frame img{display:block;width:100%;height:100%;object-fit:contain}
  .progress{position:absolute;left:0;bottom:0;height:2px;background:var(--accent);transition:width .2s}

  .notes{flex:0 0 auto;border-top:1px solid var(--rule);background:var(--surface);padding:12px 24px 14px;max-height:136px;overflow-y:auto}
  .notes.hidden{display:none}
  .notes h2{font:600 12px/1 var(--sans);color:var(--accent);letter-spacing:2px;margin-bottom:7px}
  .notes p{font-size:14.5px;line-height:1.75;color:var(--ink2);max-width:110ch}

  footer{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:8px 20px;border-top:1px solid var(--rule);background:var(--paper2);font-size:12px;color:var(--muted)}
  footer .spacer{flex:1}
  .counter{font-family:var(--serif);font-size:14px;color:var(--ink)}
  .counter b{color:var(--accent)}
  .hint{font-size:11px;color:var(--faint)}
  kbd{font:inherit;font-size:10px;border:1px solid var(--rule);border-bottom-width:2px;padding:1px 4px;border-radius:3px;background:var(--surface);color:var(--muted)}

  @media (max-width:900px){
    aside{display:none}
    .kicker,.hint{display:none}
    .notes{max-height:116px;padding:10px 16px 12px}
    .frame{max-width:100%}
  }
</style>
</head>
<body>

<header>
  <div class="brand">看懂 <span>openfde.net</span></div>
  <div class="kicker">一个网站 · 两个身份 · 三条路径</div>
  <div class="spacer"></div>
  <button class="btn" id="toggleThumbs">缩略图</button>
  <button class="btn" id="toggleNotes">讲解</button>
  <a class="btn" href="./openfde-deck.pptx" download>下载 PPTX</a>
  <a class="btn primary" href="https://openfde.net" target="_blank" rel="noopener">去官网</a>
</header>

<main>
  <aside id="thumbs"></aside>
  <div class="stage">
    <div class="canvas" id="canvas">
      <div class="frame"><img id="slide" alt=""></div>
      <div class="progress" id="progress"></div>
    </div>
    <div class="notes" id="notes">
      <h2 id="noteTitle">讲解</h2>
      <p id="noteBody"></p>
    </div>
  </div>
</main>

<footer>
  <span class="counter"><b id="cur">1</b> / <span id="total">26</span></span>
  <button class="btn" id="prev">← 上一页</button>
  <button class="btn" id="next">下一页 →</button>
  <span class="spacer"></span>
  <span class="hint"><kbd>←</kbd><kbd>→</kbd> 翻页 · <kbd>空格</kbd> 下一页 · <kbd>F</kbd> 全屏 · <kbd>N</kbd> 讲解 · <kbd>T</kbd> 缩略图</span>
  <span>素材逆向自 OpenFDEAI/OpenFDE-WEB</span>
</footer>

<script src="./slides.js"></script>
<script>
(function(){
  var img = document.getElementById('slide');
  var thumbs = document.getElementById('thumbs');
  var notesBox = document.getElementById('notes');
  var noteTitle = document.getElementById('noteTitle');
  var noteBody = document.getElementById('noteBody');
  var curEl = document.getElementById('cur');
  var progress = document.getElementById('progress');
  var i = 0;

  document.getElementById('total').textContent = SLIDES.length;

  SLIDES.forEach(function(s, idx){
    var a = document.createElement('a');
    a.className = 'thumb';
    a.href = '#p' + (idx + 1);
    a.innerHTML = '<span class="no">' + String(idx + 1).padStart(2, '0') + '</span>'
                + '<img loading="lazy" src="./slides/' + s.file + '" alt="">';
    a.addEventListener('click', function(e){ e.preventDefault(); go(idx); });
    thumbs.appendChild(a);
  });

  function go(n){
    if(n < 0 || n >= SLIDES.length) return;
    i = n;
    var s = SLIDES[i];
    img.src = './slides/' + s.file;
    img.alt = s.title;
    noteTitle.textContent = s.title;
    noteBody.textContent = s.note;
    curEl.textContent = i + 1;
    progress.style.width = ((i + 1) / SLIDES.length * 100) + '%';
    Array.prototype.forEach.call(thumbs.children, function(el, idx){
      el.classList.toggle('active', idx === i);
    });
    var active = thumbs.children[i];
    if(active) active.scrollIntoView({block:'nearest'});
    history.replaceState(null, '', '#p' + (i + 1));
    document.title = (i === 0 ? s.title : s.title + '｜看懂 openfde.net');
  }

  document.getElementById('prev').addEventListener('click', function(){ go(i - 1); });
  document.getElementById('next').addEventListener('click', function(){ go(i + 1); });
  document.getElementById('toggleNotes').addEventListener('click', function(){ notesBox.classList.toggle('hidden'); });
  document.getElementById('toggleThumbs').addEventListener('click', function(){ thumbs.classList.toggle('hidden'); });

  document.addEventListener('keydown', function(e){
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    switch(e.key){
      case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); go(i + 1); break;
      case 'ArrowLeft': case 'PageUp': e.preventDefault(); go(i - 1); break;
      case 'Home': go(0); break;
      case 'End': go(SLIDES.length - 1); break;
      case 'n': case 'N': notesBox.classList.toggle('hidden'); break;
      case 't': case 'T': thumbs.classList.toggle('hidden'); break;
      case 'f': case 'F':
        if(document.fullscreenElement) document.exitFullscreen();
        else document.documentElement.requestFullscreen();
        break;
    }
  });

  // 触屏左右滑动翻页
  var x0 = null;
  var canvas = document.getElementById('canvas');
  canvas.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  canvas.addEventListener('touchend', function(e){
    if(x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if(Math.abs(dx) > 50) go(dx < 0 ? i + 1 : i - 1);
    x0 = null;
  });

  var m = location.hash.match(/^#p(\d+)$/);
  go(m ? Math.min(SLIDES.length, Math.max(1, parseInt(m[1], 10))) - 1 : 0);
})();
</script>
</body>
</html>
